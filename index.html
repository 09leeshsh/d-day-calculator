<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제물 D-day 알리미</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; color: #333; font-size: 24px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .item:last-child { border-bottom: none; }
        .d-day { font-weight: bold; color: #e53935; font-size: 18px; width: 70px; }
        .info { flex-grow: 1; margin-left: 10px; }
        .title { font-size: 16px; font-weight: bold; margin: 0 0 5px 0; color: #222; }
        .date { font-size: 13px; color: #777; margin: 0; }
        .delete-btn { background-color: #ffebee; color: #d32f2f; width: auto; padding: 6px 12px; font-size: 13px; margin: 0; border: none; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>⏰ D-day 알리미</h1>
    
    <div class="card">
        <input type="text" id="taskName" placeholder="어떤 과제인가요?" required>
        <input type="date" id="taskDate" required>
        <button onclick="addTask()">목록에 추가하기</button>
    </div>

    <div class="card" id="taskList" style="padding: 0;">
        <!-- 과제 목록이 여기에 표시됩니다 -->
    </div>

    <script>
        // 스마트폰(브라우저)에 저장된 데이터 불러오기
        let tasks = JSON.parse(localStorage.getItem('ddayTasks')) || [];

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            // 오늘 날짜 계산 (시간은 제외하고 00시 00분 기준으로 통일)
            const today = new Date();
            today.setHours(0,0,0,0);

            // D-day 계산
            tasks.forEach(task => {
                const taskDate = new Date(task.date);
                taskDate.setHours(0,0,0,0);
                // 날짜 차이를 일(day) 단위로 계산
                const diff = Math.ceil((taskDate - today) / (1000 * 60 * 60 * 24));
                task.daysLeft = diff;
            });

            // 마감일 임박순(오름차순) 정렬
            tasks.sort((a, b) => a.daysLeft - b.daysLeft);

            // 화면에 리스트 그리기
            tasks.forEach((task, index) => {
                let dDayText = '';
                if (task.daysLeft > 0) dDayText = `D-${task.daysLeft}`;
                else if (task.daysLeft === 0) dDayText = 'D-Day';
                else dDayText = `D+${Math.abs(task.daysLeft)}`;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.innerHTML = `
                    <div class="d-day">${dDayText}</div>
                    <div class="info">
                        <p class="title">${task.name}</p>
                        <p class="date">${task.date} 마감</p>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})">완료</button>
                `;
                list.appendChild(itemDiv);
            });
        }

        // 새 과제 추가하기
        function addTask() {
            const name = document.getElementById('taskName').value;
            const date = document.getElementById('taskDate').value;

            if (!name || !date) {
                alert('과제명과 마감일을 모두 입력해주세요!');
                return;
            }

            tasks.push({ name: name, date: date });
            localStorage.setItem('ddayTasks', JSON.stringify(tasks)); // 기기에 저장
            
            // 입력칸 비우기
            document.getElementById('taskName').value = '';
            document.getElementById('taskDate').value = '';
            
            renderTasks();
        }

        // 과제 삭제(완료)하기
        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('ddayTasks', JSON.stringify(tasks));
            renderTasks();
        }

        // 프로그램 시작 시 목록 한 번 그려주기
        renderTasks();
    </script>
</body>
</html>
